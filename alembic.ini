# Alembic configuration.
#
# The async engine URL and target metadata are wired up in
# app/db/migrations/env.py (which reads app.config), so we deliberately do NOT
# hardcode sqlalchemy.url here — keeping a single source of truth for the DSN.

[alembic]
# Path to migration scripts, relative to this file.
script_location = app/db/migrations

# Template used to generate new revision filenames: a UTC timestamp prefix makes
# migrations sort chronologically regardless of the random revision id.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators when joining version_locations.
path_separator = os

# Timezone for file_template timestamps.
timezone = UTC

[post_write_hooks]
# Auto-format generated migrations with ruff.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
